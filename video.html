<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>WebGPU HDR Test</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <nav class="nav">
    <div class="loadFileContainer">
      <input type="file" id="videoLoader" class="fileInputLoader" accept="video/*">
      <label for="videoLoader">Cargar video</label>
    </div>

    <h3 id="title">Vídeo 動画</h3>

    <div class="layoutControlContainer" id="layoutControls">
      <button id="configurationBtn" command="configuration" class="layoutBtn configurationBtn">Ajustes</button>
      <button id="layout1" class="layoutBtn activeBtn">L1</button>
      <button id="layout2" class="layoutBtn">L2</button>
      <button id="layout3" class="layoutBtn">L3</button>
      <button id="layout4" class="layoutBtn">L4</button>
    </div>
  </nav>

  <main id="mainContainer">

    <dialog id="configurationPanel" class="dialogConfiguration" closedby="any" showModal="true">
      <h2 title="Configuración de colores">Configuración 色(Iru)</h2>
      <ul class="dialogList">
        <li>
          <select class="selectDialog" name="predefineValues" id="selectDialog">
            <option value="glow">Brillo</option>
            <option value="cyberpunk">Cyberpunk</option>
            <option value="nature">Natural</option>
          </select>
        </li>
        <li class="configOption" id="configOption">
          <input id="promCheck" type="checkbox" class="checkProm">
          <label for="promCheck">X Promedio</label>
          <input id="checkOther" type="checkbox" class="checkOther">
          <label for="checkOther">Otro</label>
        </li>
        <li class="rangeColorOption" id="rangeColorOption">
          <label for="rangeRed">R</label>
          <input id="rangeRed" type="range" max="4" step="0.01" class="rangeColor">
          <span id="rangeRedValue">2.00</span>
        </li>
        <li class="rangeColorOption" id="rangeColorOption">
          <label for="rangeGreen">G</label>
          <input id="rangeGreen" type="range" max="4" step="0.01" class="rangeColor">
          <span class="rangeGrenValue">2.00</span>
        </li>
        <li class="rangeColorOption" id="rangeColorOption">
          <label for="rangeBlue">B</label>
          <input id="rangeBlue" type="range" max="4" step="0.01" class="rangeColor">
          <span class="rangeBlueValue">2.00</span>
        </li>
        <li>
          <button id="resetBtn">Reset</button>
        </li>
      </ul>
    </dialog>

    <section class="viewsContainer layout1Status" id="viewsContainer">
      <video class="fileViewer" id="videoPlayer" autoplay loop muted playsinline></video>
      <canvas id="gpuCanvas"></canvas>
      <div class="controlCompared" id="controlCompared"></div>
    </section>

    <section class="videoControls" id="videoControls">
      <div class="btnContainer">
        <button class="btnControl btnMute" id="btnMute"></button>
        <button class="btnControl btnPrevious" id="btnPrevious"></button>
        <button class="btnControl btnPlay" id="btnPlayPause"></button>
        <button class="btnControl btnNext" id="btnNext"></button>
        <button class="btnControl btnFullScreen" id="btnFullScreen"></button>
      </div>
      <div class="timelineContainer">
        <span id="currentTimeVideo" class="currentTimeVideo">00:00</span>
        <input type="range" name="" id="inputTimer" class="inputTimer" step="0.1">
        <span id="durationVideo" class="durationVideo">00:00</span>
      </div>
    </section>
  </main>

</body>
<script src="js/app.js"></script>
<script type="module" src="js/video.js"></script>

</html>
